[workspace]
resolver = "2"
members = [
    "crates/fsc-core",
    "crates/fsc-sculpt",
    "crates/fsc-topo",
    "crates/fsc-paint",
    "crates/fsc-io",
    "crates/fsc-commands",
    "crates/fsc-py",
    "crates/fsc-wasm",
]

[workspace.package]
version = "0.84.0"
edition = "2021"
license = "Apache-2.0"
authors = ["nodemode-ai"]
rust-version = "1.88"
publish = false

[workspace.dependencies]
# Threads (rayon) are each crate's "parallel" feature; fsc-commands turns them on by default, and the browser build
# (fsc-wasm), which has no threads, depends on it without them.
fsc-core = { path = "crates/fsc-core", default-features = false }
fsc-sculpt = { path = "crates/fsc-sculpt" }
fsc-topo = { path = "crates/fsc-topo", default-features = false }
fsc-paint = { path = "crates/fsc-paint", default-features = false }
fsc-io = { path = "crates/fsc-io" }
fsc-commands = { path = "crates/fsc-commands", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"

[profile.dev]
opt-level = 1

# The suites remesh and render; optimised dependencies keep them to seconds.
[profile.test]
opt-level = 2
