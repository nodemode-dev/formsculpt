[package]
name = "fsc-commands"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
fsc-core.workspace = true
fsc-io.workspace = true
fsc-paint.workspace = true
fsc-sculpt.workspace = true
fsc-topo.workspace = true
glam = "0.34"
serde.workspace = true
serde_json.workspace = true

[features]
default = ["parallel"]
# Threads in the engine crates that use them; the browser build turns this off.
parallel = ["fsc-core/parallel", "fsc-topo/parallel", "fsc-paint/parallel"]

[[bin]]
name = "fsc-catalogue"
path = "src/bin/catalogue.rs"
