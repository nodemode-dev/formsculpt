[package]
name = "fsc-topo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["parallel"]
parallel = ["dep:rayon"]

[dependencies]
# Exact mesh booleans (a pure-Rust implementation after Manifold; MPL-2.0, used unmodified as a dependency).
boolmesh = { version = "0.2.1", default-features = false }
fsc-core.workspace = true
glam = "0.34"
rayon = { version = "1.12", optional = true }
